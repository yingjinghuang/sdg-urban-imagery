# Conda environment for sdg-urban-imagery.
#
# The Supplementary Information reports Python 3.10 and PyTorch 2.6.0.
# Torchvision 0.21.0 is the matching release for PyTorch 2.6.0. PyTorch 2.6
# is installed via pip because official 2.6 binaries are distributed as wheels;
# the exact CUDA wheel can be selected separately when needed for a GPU system.
#
# Create:    conda env create -f environment.yml
# Activate:  conda activate sdg

name: sdg
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip
  - numpy=1.26.*
  - pandas=2.1.*
  - scipy=1.11.*
  - scikit-learn=1.3.*
  - geopandas=0.14.*
  - shapely=2.0.*
  - h5py=3.10.*
  - pytables
  - pyyaml=6.0.*
  - tqdm
  - matplotlib=3.8.*
  - seaborn=0.13.*
  - pillow
  - joblib
  - libpysal
  - esda
  - tensorboard
  - jupyter
  - ipykernel
  - pip:
      - torch==2.6.0
      - torchvision==0.21.0
      - timm==0.9.16
      - transformers==4.36.2
      - ftfy
      - regex
