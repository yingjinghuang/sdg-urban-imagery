# Conda environment for sdg-urban-imagery.
#
# This file pins major libraries to versions known to work with the codebase.
# Exact versions used in the paper's training environment will be substituted
# after a `pip freeze` from the original training server.
#
# Create:    conda env create -f environment.yml
# Activate:  conda activate sdg

name: sdg
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip
  - pytorch=2.1.*
  - torchvision=0.16.*
  - pytorch-cuda=12.1
  - numpy=1.26.*
  - pandas=2.1.*
  - scipy=1.11.*
  - scikit-learn=1.3.*
  - geopandas=0.14.*
  - shapely=2.0.*
  - h5py=3.10.*
  - pyyaml=6.0.*
  - tqdm
  - matplotlib=3.8.*
  - seaborn=0.13.*
  - joblib
  - jupyter
  - ipykernel
  - pip:
      - timm==0.9.16
      - transformers==4.36.2
      - ftfy
      - regex
