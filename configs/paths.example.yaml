# Copy this file to paths.yaml and edit for your local machine.
# All scripts and bash launchers read paths from this file.
#
# Recommended layout: a single data_root containing raw/, processed/,
# features/, labels/, and outputs/ subdirectories.

# --- Root directories -------------------------------------------------------

data_root: /path/to/sdg_data        # base for everything below
output_root: /path/to/sdg_outputs   # regression and figure outputs

# --- Raw imagery ------------------------------------------------------------
# Only required for re-running pretraining or feature extraction from scratch.
# Most users will download the pre-extracted features and skip this section.
#
# Satellite imagery in the paper was obtained through the Google Static Maps
# API at approximately 0.6 m spatial resolution. Raw third-party imagery is not
# redistributed in the Zenodo release.

raw_sv_dir: ${data_root}/raw/GoogleSV          # Google Street View Static API images
raw_rs_dir: ${data_root}/raw/GoogleSatellite   # ~0.6 m satellite imagery from Google Static Maps API

# --- Processed per-country tables ------------------------------------------

processed_dir: ${data_root}/processed
# Per-country labels, neighborhood boundaries, image-path manifests,
# train/test split definitions, and fitted scalers. Generated by
# src/preprocess/*.py from the raw country-specific census tables.
# (The legacy on-disk name for this directory was `inter/`; either works
# — just point processed_dir at wherever your processed tables live.)

# --- Extracted features ----------------------------------------------------

features_raw_dir: ${data_root}/features/Raw    # per-image .h5 (large)
features_unit_dir: ${data_root}/features/Unit  # neighborhood-aggregated .pkl
seg_results_dir: ${data_root}/seg_results      # per-image ADE20K class distributions

# --- Labels (sustainability indicators) -------------------------------------

labels_dir: ${data_root}/labels                # per-country indicator tables

# --- Pretrained checkpoints (input to feature extraction) ------------------

mocov3_ckpt_dir: ${data_root}/pretrain_ckpts   # downloaded from Zenodo (read-only)

# --- Pretraining and regression outputs ------------------------------------

pretrain_out_dir: ${output_root}/pretrain      # only if re-running pretraining
regression_out_dir: ${output_root}/regression  # token_reg.py outputs

# --- Compute -----------------------------------------------------------------

cuda_devices: "0"                              # comma-separated GPU IDs
