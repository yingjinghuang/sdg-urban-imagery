# Copy this file to paths.yaml and edit for your local machine.
# All maintained scripts and bash launchers read paths from this file.
#
# Recommended layout: a single data_root containing raw/, processed/,
# features/, labels/, and pretrain_ckpts/ subdirectories, plus a separate
# output_root for generated regression/figure outputs.

# --- Root directories -------------------------------------------------------

data_root: /path/to/sdg_data        # base for deposited/local data
output_root: /path/to/sdg_outputs   # generated regression and figure outputs

# --- Raw imagery ------------------------------------------------------------
# Only required for rerunning pretraining, raw CLIP scoring, or feature
# extraction from scratch. Most reproducibility users can start from the
# deposited neighborhood-level representations and checkpoints instead.
#
# Satellite imagery in the paper was obtained through the Google Static Maps
# API at approximately 0.6 m spatial resolution. Raw third-party imagery is not
# redistributed in the Zenodo release.

raw_sv_dir: ${data_root}/raw/GoogleSV          # Google Street View Static API images
raw_rs_dir: ${data_root}/raw/GoogleSatellite   # ~0.6 m satellite imagery from Google Static Maps API

# --- Processed neighborhood tables -----------------------------------------

processed_dir: ${data_root}/processed
# Processed neighborhood labels/metadata, image-to-neighborhood manifests,
# split definitions, geographic tables, and fitted scalers. For exact paper
# reproduction these are supplied in the derived-data bundle (or can be
# recreated independently as long as they match docs/data_schema.md).
# Country-specific ingestion from raw national statistical sources is not a
# single maintained pipeline in this release; see src/preprocess/README.md.

# --- Extracted features -----------------------------------------------------

features_raw_dir: ${data_root}/features/Raw    # per-image .h5; large/optional
features_unit_dir: ${data_root}/features/Unit  # neighborhood-aggregated .pkl
seg_results_dir: ${data_root}/seg_results      # per-image ADE20K class distributions

# --- Labels (sustainability indicators) ------------------------------------

labels_dir: ${data_root}/labels                # per-country indicator tables where used

# --- Pretrained checkpoints (input to feature extraction) ------------------

mocov3_ckpt_dir: ${data_root}/pretrain_ckpts   # downloaded from reviewer/public data release

# --- Pretraining and regression outputs ------------------------------------

pretrain_out_dir: ${output_root}/pretrain      # only if rerunning pretraining
regression_out_dir: ${output_root}/regression  # canonical fold/ratio/sampling outputs

# --- Compute ---------------------------------------------------------------

cuda_devices: "0"                              # comma-separated GPU IDs
